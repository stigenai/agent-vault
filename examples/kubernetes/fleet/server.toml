schema_version = 1

[server]
host = "0.0.0.0"
port = 14321
proxy_port = 14322
external_address = "https://agent-vault.agent-vault.svc.cluster.local"
log_level = "info"
detach = false

[database]
url = "file:///var/run/secrets/agent-vault/database-url"
max_open_conns = 25
max_idle_conns = 10
conn_max_lifetime = "5m"

[proxy]
max_request_bytes = 1073741824
max_response_bytes = 0
allow_private_ranges = false
network_allowlist = []
trusted_proxies = ["10.0.0.0/8"]

[client]
address = "https://agent-vault.agent-vault.svc.cluster.local"
workload_api = "unix:///run/spire/sockets/agent.sock"
trust_domains = ["spiffe://cluster.example"]

[encryption]
legacy_master_password = "file:///var/run/secrets/agent-vault/master-password"

[logs]
max_age = "168h"
max_rows_per_vault = 10000
retention_locked = true

[rate_limit]
profile = "default"
locked = true

[telemetry]
enabled = false
