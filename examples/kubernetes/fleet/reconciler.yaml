apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-vault-reconciler
  labels:
    app.kubernetes.io/name: agent-vault
    app.kubernetes.io/component: reconciler
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agent-vault-reconciler
  labels:
    app.kubernetes.io/name: agent-vault
    app.kubernetes.io/component: reconciler
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: agent-vault
            app.kubernetes.io/component: reconciler
        spec:
          serviceAccountName: agent-vault-reconciler
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconcile
              image: ghcr.io/stigenai/agent-vault:v0.39.1
              args:
                - config
                - apply
                - --yes
                - --file
                - /etc/agent-vault/desired/base.toml
                - --file
                - /etc/agent-vault/desired/environment.toml
              env:
                - {name: AGENT_VAULT_CONFIG, value: /etc/agent-vault/server.toml}
                - {name: HOME, value: /tmp/agent-vault}
              volumeMounts:
                - name: runtime-config
                  mountPath: /etc/agent-vault/server.toml
                  subPath: server.toml
                  readOnly: true
                - name: desired-state
                  mountPath: /etc/agent-vault/desired
                  readOnly: true
                - name: spire-agent-socket
                  mountPath: /run/spire/sockets
                  readOnly: true
                - name: runtime-data
                  mountPath: /tmp/agent-vault
              securityContext:
                runAsUser: 65532
                runAsGroup: 65532
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
                readOnlyRootFilesystem: true
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 500m, memory: 256Mi}
          volumes:
            - name: runtime-config
              configMap:
                name: agent-vault-config
            - name: desired-state
              configMap:
                name: agent-vault-fleet-desired
            - name: spire-agent-socket
              csi:
                driver: csi.spiffe.io
                readOnly: true
            - name: runtime-data
              emptyDir:
                sizeLimit: 32Mi
