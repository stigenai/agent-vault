apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-vault
  labels:
    app.kubernetes.io/name: agent-vault
    app.kubernetes.io/component: broker
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-vault
  labels:
    app.kubernetes.io/name: agent-vault
    app.kubernetes.io/component: broker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-vault
      app.kubernetes.io/component: broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-vault
        app.kubernetes.io/component: broker
    spec:
      serviceAccountName: agent-vault
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: agent-vault
              app.kubernetes.io/component: broker
      initContainers:
        - name: validate-config
          image: ghcr.io/stigenai/agent-vault:v0.39.1
          args: ["config", "validate", "--config", "/etc/agent-vault/server.toml", "--quiet"]
          env:
            - {name: HOME, value: /tmp/agent-vault}
          volumeMounts:
            - {name: config, mountPath: /etc/agent-vault, readOnly: true}
            - {name: secrets, mountPath: /var/run/secrets/agent-vault, readOnly: true}
            - {name: runtime-data, mountPath: /tmp/agent-vault}
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
      containers:
        - name: agent-vault
          image: ghcr.io/stigenai/agent-vault:v0.39.1
          args: ["server", "--config", "/etc/agent-vault/server.toml"]
          env:
            - {name: HOME, value: /tmp/agent-vault}
          ports:
            - {name: api, containerPort: 14321}
            - {name: proxy, containerPort: 14322}
          volumeMounts:
            - {name: config, mountPath: /etc/agent-vault, readOnly: true}
            - {name: secrets, mountPath: /var/run/secrets/agent-vault, readOnly: true}
            - {name: spire-agent-socket, mountPath: /run/spire/sockets, readOnly: true}
            - {name: runtime-data, mountPath: /tmp/agent-vault}
          startupProbe:
            httpGet: {path: /health/startup, port: api, scheme: HTTPS}
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: api, scheme: HTTPS}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /health/live, port: api, scheme: HTTPS}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
      volumes:
        - name: config
          configMap:
            name: agent-vault-config
        - name: secrets
          secret:
            secretName: agent-vault-secrets
            items:
              - {key: database-url, path: database-url}
              - {key: master-password, path: master-password}
              - {key: postgres-ca.crt, path: postgres-ca.crt}
        - name: spire-agent-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: runtime-data
          emptyDir:
            sizeLimit: 64Mi
