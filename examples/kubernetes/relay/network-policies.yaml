---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: example-agent-relay-to-broker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: example-agent-relay
      agent-vault.stigen.ai/identity: example-agent
      agent-vault.stigen.ai/role: relay
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-vault
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-vault
      ports:
        - {protocol: TCP, port: 14322}
