apiVersion: v1
kind: ServiceAccount
metadata:
  name: example-agent
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: example-agent
      agent-vault.stigen.ai/role: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: example-agent
        agent-vault.stigen.ai/identity: example-agent
        agent-vault.stigen.ai/role: agent
    spec:
      serviceAccountName: example-agent
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ghcr.io/stigenai/example-agent:latest
          env:
            - {name: HTTPS_PROXY, value: "http://example-agent-relay:14322"}
            - {name: HTTP_PROXY, value: "http://example-agent-relay:14322"}
            - {name: NO_PROXY, value: "localhost,127.0.0.1"}
            - {name: SSL_CERT_FILE, value: "/etc/agent-vault/ca/ca.pem"}
            - {name: NODE_EXTRA_CA_CERTS, value: "/etc/agent-vault/ca/ca.pem"}
            - {name: REQUESTS_CA_BUNDLE, value: "/etc/agent-vault/ca/ca.pem"}
            - {name: CURL_CA_BUNDLE, value: "/etc/agent-vault/ca/ca.pem"}
            - {name: GIT_SSL_CAINFO, value: "/etc/agent-vault/ca/ca.pem"}
            - {name: DENO_CERT, value: "/etc/agent-vault/ca/ca.pem"}
            - {name: NODE_USE_ENV_PROXY, value: "1"}
            - {name: OPENCLAW_PROXY_URL, value: "http://example-agent-relay:14322"}
          volumeMounts:
            - {name: mitm-ca, mountPath: /etc/agent-vault/ca, readOnly: true}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: mitm-ca
          configMap:
            name: agent-vault-mitm-ca
