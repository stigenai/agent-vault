apiVersion: v1
kind: ServiceAccount
metadata:
  name: example-agent-relay
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: example-agent-relay
spec:
  selector:
    app.kubernetes.io/name: example-agent-relay
    agent-vault.stigen.ai/identity: example-agent
    agent-vault.stigen.ai/role: relay
  ports:
    - {name: relay, port: 14322, targetPort: relay}
    - {name: metrics, port: 9464, targetPort: metrics}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-agent-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: example-agent-relay
      agent-vault.stigen.ai/identity: example-agent
      agent-vault.stigen.ai/role: relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: example-agent-relay
        agent-vault.stigen.ai/identity: example-agent
        agent-vault.stigen.ai/role: relay
    spec:
      serviceAccountName: example-agent-relay
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-vault-relay
          image: ghcr.io/stigenai/agent-vault:v0.39.1
          args: ["relay", "--config", "/etc/agent-vault/relay.toml"]
          ports:
            - {name: relay, containerPort: 14322}
            - {name: metrics, containerPort: 9464}
          volumeMounts:
            - {name: relay-config, mountPath: /etc/agent-vault, readOnly: true}
            - {name: spire-agent-socket, mountPath: /run/spire/sockets, readOnly: true}
          startupProbe:
            tcpSocket: {port: relay}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket: {port: relay}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket: {port: relay}
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {cpu: 250m, memory: 128Mi}
      volumes:
        - name: relay-config
          configMap:
            name: agent-vault-relay-config
        - name: spire-agent-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
